apiVersion: v1
kind: Service
metadata:
  name: {{ include "k0sstreams.fullname" . }}-lb
  labels:
    {{- include "k0sstreams.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.loadBalancer.type }}
  selector:
    {{- include "k0sstreams.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.loadBalancer.port }}
      targetPort: {{ .Values.service.loadBalancer.targetPort }}
