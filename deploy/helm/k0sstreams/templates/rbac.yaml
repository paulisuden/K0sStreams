{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k0sstreams.name" . }}-leader-election
  labels:
    {{- include "k0sstreams.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k0sstreams.name" . }}-leader-election
  labels:
    {{- include "k0sstreams.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k0sstreams.name" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "k0sstreams.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
