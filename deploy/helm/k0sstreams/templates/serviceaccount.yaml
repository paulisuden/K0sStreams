apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k0sstreams.serviceAccountName" . }}
  labels:
    {{- include "k0sstreams.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- define "k0sstreams.serviceAccountName" -}}
{{- default .Chart.Name .Values.serviceAccount.name }}
{{- end }}
