# Broker en Kubernetes: 3 réplicas con un PVC cada una, Service headless entre brokers y LoadBalancer para clientes.
#
# En minikube:
#   minikube start --driver=docker
#   minikube image build -t k0sstreams/broker:dev .     # la imagen queda adentro de minikube, sin registry
#   kubectl apply -f deploy/
#   kubectl rollout status statefulset/broker
#   minikube service broker-lb --url                     # URL del LoadBalancer (en la cátedra la da MetalLB)
#
# Después de cambiar el código: de nuevo "minikube image build ..." y "kubectl rollout restart statefulset/broker".
# Con el mismo tag los pods no ven la imagen nueva hasta reiniciarse ("minikube image load" no la reemplaza).
#
# Fase 3: líder fijo broker-0. En la fase 4 el Lease reemplaza Coordination__LeaderId.

# Headless: le da a cada pod un DNS estable (broker-0.broker), que es lo que usan LeaderAddress y Replication:Peers.
apiVersion: v1
kind: Service
metadata:
  name: broker
  labels:
    app: broker
spec:
  clusterIP: None
  # El DNS de un pod existe aunque todavía no esté Ready: un seguidor que arranca igual tiene que recibir réplicas.
  publishNotReadyAddresses: true
  selector:
    app: broker
  ports:
    - name: http
      port: 9090
    - name: grpc
      port: 9091
---
# Entrada única para los clientes: reparte entre los pods Ready. Solo HTTP; el gRPC queda dentro del cluster.
apiVersion: v1
kind: Service
metadata:
  name: broker-lb
  labels:
    app: broker
spec:
  type: LoadBalancer
  selector:
    app: broker
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
  labels:
    app: broker
spec:
  serviceName: broker
  replicas: 3
  # Los 3 arrancan a la vez: con el orden por defecto, si broker-0 no arranca, broker-1 y broker-2 tampoco.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      securityContext:
        # La imagen corre como $APP_UID (1654) y el PVC se monta como root: sin esto no puede escribir /data.
        fsGroup: 1654
      affinity:
        # Un broker por nodo cuando hay nodos de sobra: si los 3 caen en el mismo nodo, perder ese nodo los tira a todos.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: broker
      containers:
        - name: broker
          image: k0sstreams/broker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: Broker__NodeId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: Coordination__LeaderId
              value: broker-0
            - name: Coordination__LeaderAddress
              value: http://broker-0.broker:9090
            - name: Replication__Peers__broker-0
              value: http://broker-0.broker:9091
            - name: Replication__Peers__broker-1
              value: http://broker-1.broker:9091
            - name: Replication__Peers__broker-2
              value: http://broker-2.broker:9091
          ports:
            - name: http
              containerPort: 9090
            - name: grpc
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
