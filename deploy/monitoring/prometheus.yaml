# Prometheus para la demo: descubre los pods del cluster por las anotaciones prometheus.io/*
# y guarda las series en memoria del pod (emptyDir). No es para producción: al reiniciarse
# pierde el histórico. Para la defensa alcanza y evita depender de un PVC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: k0sstreams
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k0sstreams-prometheus
rules:
  # Solo lectura, y solo lo que necesita el descubrimiento de pods.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k0sstreams-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k0sstreams-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: k0sstreams
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: k0sstreams
data:
  prometheus.yml: |
    global:
      # 10s: en la demo el failover dura pocos segundos y con 30s se vería un solo punto.
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      # Un solo job para todo el cluster: scrapea cualquier pod que tenga
      # prometheus.io/scrape: "true". Los brokers la traen en deploy/broker.yaml y en el chart.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # La ruta la decide el pod; el broker usa /metrics.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # El puerto también: se reemplaza el del descubrimiento por el anotado.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # Un pod que se reinicia conserva su nombre, así que la serie no se corta en el failover.
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: instance

      # SkyWatch expone Prometheus en el 9100, pero sus pods no llevan las anotaciones de arriba
      # y sus manifiestos son de otro equipo (cluster_k0s/08_skywatch). Se los busca por su
      # etiqueta app, en cualquiera de los dos namespaces: asi se puede comparar el mismo
      # pipeline corriendo sobre K0sStreams y sobre Kafka.
      - job_name: skywatch
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: skywatch-(producer|tracker|aggregator)
          # El puerto de metricas no esta declarado en el pod, asi que se fija aca.
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9100
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: instance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: k0sstreams
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        # La imagen corre como nobody (65534) y necesita escribir en el emptyDir.
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # 6 horas alcanzan para la demo y acotan lo que ocupa en memoria del nodo.
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: k0sstreams
  labels:
    app: prometheus
spec:
  # Solo lo consume Grafana desde dentro del cluster.
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
