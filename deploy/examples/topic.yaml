# Un tópico declarado con la CRD Topic (deploy/topic-crd.yaml). Va en una subcarpeta porque "kubectl apply -f deploy/"
# no entra en subcarpetas: si se aplicara en la misma pasada que la CRD, Kubernetes todavía no conocería el tipo Topic.
#
#   kubectl apply -f deploy/examples/topic.yaml
#   kubectl get topics
#   curl -s -o /dev/null -w "%{http_code}\n" "$(minikube service broker-lb --url)/v1/topics/pedidos/partitions/0/messages?max=1"   # 200 en menos de 5 s (404 si no existe)
apiVersion: k0sstreams.io/v1
kind: Topic
metadata:
  name: pedidos
spec:
  partitions: 1
  maxRetries: 3
  retryBackoffSeconds: 5
