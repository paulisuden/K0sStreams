name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sin esto, dos pushes seguidos compiten por el bump del chart y uno falla.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  image:
    name: Imagen Docker
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k0sstreams-broker
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build (push solo en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags || 'k0sstreams/broker:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Actualizar tag del chart
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apuntar el chart a la imagen publicada
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA::7}"
          values="deploy/helm/k0sstreams/values.yaml"

          sed -i -E "s|^(  tag: ).*|\1\"sha-${short}\"|" "$values"
          sed -i -E "s|^appVersion:.*|appVersion: \"sha-${short}\"|" deploy/helm/k0sstreams/Chart.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$values" deploy/helm/k0sstreams/Chart.yaml

          if git diff --cached --quiet; then
            echo "El chart ya apunta a sha-${short}."
            exit 0
          fi

          git commit -m "chore(chart): apuntar a la imagen sha-${short} [skip ci]"
          git push
